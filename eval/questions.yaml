# Evaluation question set for NR2Dashboard.
#
# Each entry has:
#   id:        short stable handle
#   q:         the user-facing question (English or Greek)
#   shape:     distribution | trend | ranking | comparison | anomaly | open_ended
#   language:  en | el
#   notes:     human notes; not consumed by the harness
#
# The first ten are also covered by `golden.yaml` with hand-written SQL +
# expected numeric values, so Stream D's pytest can verify the formulas.

- id: q01_pie_languages
  q: "Show me a pie chart of Greek vs English users."
  shape: distribution
  language: en
  notes: Verbatim from BRIEF.md. Must produce a pie/donut, two slices.

- id: q02_health_this_week
  q: "How is the bot doing this week?"
  shape: open_ended
  language: en
  notes: Verbatim from BRIEF.md. Should surface containment/CSAT/AHT + trend.

- id: q03_containment_by_intent_week
  q: "Show me containment rate by intent type this week."
  shape: ranking
  language: en
  notes: PPTX slide example. Bar with threshold-color rule (purple ≥85% / orange below).

