[project]
name = "nr2dashboard"
version = "0.1.0"
description = "Natural-language → dashboard over the SmartRep voicebot dataset"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "duckdb>=1.0.0",
    "streamlit>=1.36",
    "plotly>=5.22",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "sqlglot>=25.0",
    "google-genai>=0.3",
    "openai>=1.40",
    "pyyaml>=6.0",
    "mcp>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
# >=77 required for SPDX `license = "MIT"` + `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This is a Streamlit app, not a library. Setuptools auto-discovery would
# pick up `data/`, `eval/`, `prompts/` as packages, so we disable it and
# list our top-level modules explicitly. `packages = []` is required —
# `py-modules` alone doesn't turn off package discovery.
packages = []
py-modules = [
    "app",
    "db",
    "eval_grading",
    "llm_client",
    "mcp_server",
    "mcp_tools",
    "orchestrator",
    "renderer",
    "sql_safety",
    "turn_log",
]
